[package]
name = "sama-display"
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/sneakypeanut/sama-display"
description = "Read-only CPU/GPU temperature display for the SAMA 480x480 USB cooler screen"
license = "MIT"

[lib]
name = "sama_display"
path = "src/lib.rs"

[[bin]]
name = "sama-display"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "std"] }
image = "0.25.10"
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
libc = "0.2.191"
log = "0.4.35"
rusb = { version = "0.9.4", features = ["vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[dev-dependencies]
sha2 = "0.10.9"
